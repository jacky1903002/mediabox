<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaBox Pro - 多媒體播放器與照片紀錄系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS XLSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ypm: {
                            red: '#ea445a',
                            darkBg: '#0f0f11',
                            cardBg: '#18181c',
                            hoverBg: '#26262b',
                            textMuted: '#8b8b93'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #a1a1aa;
            border-radius: 4px;
        }
        .tab-btn.active {
            color: #3b82f6;
            border-bottom: 2px solid #3b82f6;
            font-weight: 700;
        }
        .drag-over {
            border: 2px dashed #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.05) !important;
        }
        .photo-drag-over {
            border: 2px dashed #f59e0b !important;
            background-color: rgba(245, 158, 11, 0.05) !important;
        }
        .card-dragging {
            opacity: 0.4;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar bg-zinc-950 text-zinc-100 dark:bg-[#0f0f11] dark:text-zinc-100">

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBASZegMIn7bxgRaoz8b860PF8nUmGNgls",
            authDomain: "mediabox-f57c7.firebaseapp.com",
            projectId: "mediabox-f57c7",
            storageBucket: "mediabox-f57c7.firebasestorage.app",
            messagingSenderId: "617898895254",
            appId: "1:617898895254:web:75888aa1c8e2979f829fb7",
            measurementId: "G-S8KH7L3C41",
            databaseURL: "https://mediabox-f57c7-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.fbAuth = auth;
        window.fbDb = db;
        window.fbServices = {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            updateProfile,
            ref, set, get, onValue
        };

        if (window.initAppListeners) window.initAppListeners();
    </script>

    <!-- HEADER / NAVIGATION BAR -->
    <header class="bg-white dark:bg-[#18181c] border-b border-zinc-200 dark:border-zinc-800 sticky top-0 z-40 shadow-md transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg">
                        <i class="fa-solid fa-play text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-xl text-zinc-900 dark:text-white tracking-tight flex items-center gap-2">
                            MediaBox <span class="text-[10px] px-2 py-0.5 bg-blue-500/20 text-blue-500 dark:text-blue-400 rounded-full font-bold border border-blue-500/30">PRO</span>
                        </h1>
                        <p class="text-[11px] text-zinc-500 dark:text-zinc-400">多媒體影音與照片紀錄管理系統</p>
                    </div>
                </div>

                <div class="hidden md:flex items-center space-x-6 text-xs">
                    <div class="flex items-center space-x-2 bg-zinc-100 dark:bg-zinc-800 px-3 py-1.5 rounded-full border border-zinc-200 dark:border-zinc-700">
                        <span id="connDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="connStatus" class="font-medium text-zinc-700 dark:text-zinc-300">🟢 已連線數據庫</span>
                    </div>
                    <div class="flex items-center space-x-2 text-zinc-600 dark:text-zinc-400 bg-zinc-100 dark:bg-zinc-900 px-3 py-1.5 rounded-lg border border-zinc-200 dark:border-zinc-800">
                        <i class="fa-regular fa-clock text-blue-500"></i>
                        <span>上次同步: <strong id="lastSaveTime" class="text-zinc-800 dark:text-zinc-200 font-mono">未連線</strong></span>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-amber-400 flex items-center justify-center border border-zinc-200 dark:border-zinc-700 transition" title="切換日/夜模式">
                        <i id="darkModeIcon" class="fa-solid fa-moon"></i>
                    </button>

                    <div id="userInfoBox" class="hidden flex items-center space-x-2 bg-zinc-100 dark:bg-zinc-800 p-1.5 pr-3 rounded-full border border-zinc-200 dark:border-zinc-700">
                        <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-xs" id="userAvatar">U</div>
                        <span id="userNameDisplay" class="text-xs font-semibold text-zinc-800 dark:text-zinc-200 max-w-[120px] truncate">使用者</span>
                        <button onclick="handleLogout()" class="text-zinc-500 hover:text-blue-500 text-xs ml-1" title="登出">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                    <button id="loginBtnTrigger" onclick="openAuthModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md transition">
                        <i class="fa-solid fa-user-lock mr-1.5"></i> 會員登入 / 註冊
                    </button>
                </div>
            </div>
        </div>

        <!-- 固定分頁導覽 -->
        <nav class="bg-zinc-50 dark:bg-[#121215] border-t border-zinc-200 dark:border-zinc-800 px-4 sm:px-6 lg:px-8">
            <div class="max-w-7xl mx-auto flex space-x-8 overflow-x-auto custom-scrollbar text-xs sm:text-sm font-medium text-zinc-500 dark:text-zinc-400" id="tabNavContainer">
                <button onclick="switchTab(1)" id="tabBtn1" class="tab-btn active py-3 flex items-center space-x-2 whitespace-nowrap transition cursor-pointer">
                    <i class="fa-solid fa-film text-base"></i>
                    <span id="tabTitle1" class="tab-title font-bold">影音撥放器</span>
                </button>
                <button onclick="switchTab(2)" id="tabBtn2" class="tab-btn py-3 flex items-center space-x-2 whitespace-nowrap transition cursor-pointer">
                    <i class="fa-solid fa-images text-base"></i>
                    <span id="tabTitle2" class="tab-title font-bold">照片記錄</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">

        <!-- ================= TAB 1: 影音撥放器 ================= -->
        <div id="tabContent1" class="tab-panel space-y-6">
            <!-- 影音撥放器獨立工具列與標題 -->
            <div class="bg-white dark:bg-[#1e1e24] p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border border-zinc-200 dark:border-zinc-800 shadow-xl transition-colors">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-clapperboard text-lg"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-zinc-900 dark:text-white text-base">影音撥放器</h2>
                        <p class="text-xs text-zinc-500 dark:text-zinc-400">自訂影片上傳與分類管理，支援跨區自由拖曳排序</p>
                    </div>
                </div>
                <!-- 獨立匯入匯出與新增按鈕 -->
                <div class="flex items-center gap-2 flex-wrap text-xs">
                    <label class="cursor-pointer bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-700 font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-file-excel text-emerald-500"></i>
                        <span>匯入 EXCEL</span>
                        <input type="file" accept=".xlsx, .xls" onchange="importVideoExcel(event)" class="hidden">
                    </label>
                    <button onclick="exportVideoExcel()" class="bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-700 font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-file-export text-emerald-500"></i>
                        <span>匯出 EXCEL</span>
                    </button>
                    <button onclick="exportVideoPNG()" class="bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-700 font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-file-image text-blue-500"></i>
                        <span>PNG</span>
                    </button>
                    <button onclick="exportVideoPDF()" class="bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-700 font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-file-pdf text-rose-500"></i>
                        <span>PDF</span>
                    </button>
                    <button onclick="openVideoModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow transition flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> 新增影音
                    </button>
                </div>
            </div>

            <!-- MEDIA PLAYER AREA -->
            <div id="videoExportArea" class="space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-4">
                        <div class="bg-black border border-zinc-200 dark:border-zinc-800 rounded-2xl overflow-hidden shadow-2xl relative aspect-video flex items-center justify-center group">
                            <iframe id="ytVideoIframe" class="w-full h-full" src="" title="Media Player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                        <div class="bg-white dark:bg-[#1e1e24] border border-zinc-200 dark:border-zinc-800 p-4 rounded-xl flex items-center justify-between transition-colors">
                            <div>
                                <span class="text-[10px] uppercase font-bold px-2 py-0.5 bg-blue-500/20 text-blue-600 dark:text-blue-400 rounded" id="vpCategoryTag">CINEMA</span>
                                <h3 class="text-base font-bold text-zinc-900 dark:text-white mt-1" id="vpTitle">點選下方清單或播放按鈕開始播放影音</h3>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-white dark:bg-[#1e1e24] border border-zinc-200 dark:border-zinc-800 rounded-2xl p-5 flex flex-col shadow-xl transition-colors">
                            <h3 class="font-bold text-zinc-900 dark:text-white text-sm mb-3 flex items-center justify-between">
                                <span class="flex items-center gap-2"><i class="fa-solid fa-film text-blue-500"></i> 播放清單</span>
                                <span class="text-xs text-zinc-400 dark:text-zinc-500" id="videoPlaylistCount">0 部</span>
                            </h3>
                            <div class="space-y-2 overflow-y-auto max-h-[360px] custom-scrollbar" id="videoPlaylistContainer"></div>
                        </div>
                    </div>
                </div>

                <!-- 依分類排序與可自由拖曳區塊 -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-base text-zinc-900 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-layer-group text-blue-500"></i> 影音分類排序與拖曳管理
                        </h3>
                        <div class="flex items-center gap-3">
                            <button id="batchDeleteVideoBtn" onclick="batchDeleteVideo()" class="hidden px-3 py-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 hover:bg-blue-600 hover:text-white border border-blue-500/30 text-xs font-bold rounded-lg transition flex items-center gap-1.5">
                                <i class="fa-solid fa-trash-can"></i> 刪除選取 (<span id="selectedVideoCount">0</span>)
                            </button>
                            <span class="text-xs text-zinc-400"><i class="fa-solid fa-up-down-left-right mr-1"></i>抓取卡片可自由跨分類拖曳排序</span>
                        </div>
                    </div>
                    
                    <div id="videoCategorySections" class="space-y-6"></div>
                </div>
            </div>
        </div>

        <!-- ================= TAB 2: 照片記錄 ================= -->
        <div id="tabContent2" class="tab-panel hidden space-y-6">
            <!-- 照片記錄獨立工具列與標題 -->
            <div class="bg-white dark:bg-[#18181c] p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border border-zinc-200 dark:border-zinc-800 shadow-xl transition-colors">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-600 text-white flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-folder-tree text-lg"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-zinc-900 dark:text-white text-base">照片記錄</h2>
                        <p class="text-xs text-zinc-500 dark:text-zinc-400">已連結 GitHub (`jacky1903002/mediabox/image`) 自動載入並解析檔名備註</p>
                    </div>
                </div>

                <!-- 獨立匯入匯出與操作按鈕 -->
                <div class="flex items-center gap-2 flex-wrap text-xs">
                    <button onclick="loadPhotosFromGithub()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded-xl font-bold transition flex items-center space-x-1.5 shadow-md">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>同步 GitHub 照片</span>
                    </button>

                    <div class="flex bg-zinc-100 dark:bg-[#121215] p-1 rounded-xl border border-zinc-200 dark:border-zinc-800 font-bold mr-1">
                        <button onclick="setPhotoSize('small')" id="sizeBtnSmall" class="px-2.5 py-1 rounded-lg transition text-zinc-500 dark:text-zinc-400">小</button>
                        <button onclick="setPhotoSize('medium')" id="sizeBtnMedium" class="px-2.5 py-1 rounded-lg transition bg-white dark:bg-zinc-800 text-amber-600 dark:text-amber-400 shadow">中</button>
                        <button onclick="setPhotoSize('large')" id="sizeBtnLarge" class="px-2.5 py-1 rounded-lg transition text-zinc-500 dark:text-zinc-400">大</button>
                    </div>

                    <label class="cursor-pointer bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-700 font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-file-excel text-emerald-500"></i>
                        <span>匯入 EXCEL</span>
                        <input type="file" accept=".xlsx, .xls" onchange="importPhotoExcel(event)" class="hidden">
                    </label>
                    <button onclick="exportPhotoExcel()" class="bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-700 font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-file-export text-emerald-500"></i>
                        <span>匯出 EXCEL</span>
                    </button>
                    <button onclick="exportPhotoPNG()" class="bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-700 font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-file-image text-amber-500"></i>
                        <span>PNG</span>
                    </button>
                    <button onclick="exportPhotoPDF()" class="bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 px-3 py-2 rounded-xl border border-zinc-200 dark:border-zinc-700 font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-file-pdf text-rose-500"></i>
                        <span>PDF</span>
                    </button>

                    <button id="batchDeletePhotoBtn" onclick="batchDeletePhoto()" class="hidden px-3 py-2 bg-amber-500/10 text-amber-600 dark:text-amber-400 hover:bg-amber-600 hover:text-white border border-amber-500/30 font-bold rounded-xl transition flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> 刪除選取 (<span id="selectedPhotoCount">0</span>)
                    </button>

                    <button onclick="openPhotoModal()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow transition flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> 新增照片
                    </button>
                </div>
            </div>

            <!-- 相片分區顯示區域 (匯出用區域) -->
            <div id="photoExportArea" class="space-y-6">
                <div id="photoCategorySections" class="space-y-8"></div>
            </div>
        </div>

    </main>

    <footer class="bg-white dark:bg-[#18181c] border-t border-zinc-200 dark:border-zinc-800 py-4 px-4 text-center text-xs text-zinc-500 transition-colors">
        <p>MediaBox Pro © 2026 多媒體影音與照片記錄管理系統</p>
    </footer>

    <!-- AUTH MODAL -->
    <div id="authModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#18181c] border border-zinc-200 dark:border-zinc-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-zinc-200 dark:border-zinc-800 pb-3">
                <h3 class="font-bold text-base text-zinc-900 dark:text-white">會員登入 / 註冊</h3>
                <button onclick="closeAuthModal()" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div class="flex bg-zinc-100 dark:bg-[#121215] p-1 rounded-xl">
                    <button onclick="setAuthMode('login')" id="authTabLogin" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow">登入</button>
                    <button onclick="setAuthMode('register')" id="authTabRegister" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition text-zinc-400">註冊帳號</button>
                </div>
                <div id="realNameField" class="hidden space-y-1">
                    <label class="text-xs font-semibold text-zinc-600 dark:text-zinc-400">真實姓名</label>
                    <input type="text" id="authRealName" placeholder="例如: 王小明" class="w-full text-xs p-2.5 bg-zinc-100 dark:bg-[#121215] border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white rounded-xl">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-zinc-600 dark:text-zinc-400">電子郵件 (Email)</label>
                    <input type="email" id="authEmail" placeholder="user@example.com" class="w-full text-xs p-2.5 bg-zinc-100 dark:bg-[#121215] border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white rounded-xl">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-zinc-600 dark:text-zinc-400">密碼 (Password)</label>
                    <input type="password" id="authPassword" placeholder="******" class="w-full text-xs p-2.5 bg-zinc-100 dark:bg-[#121215] border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white rounded-xl">
                </div>
                <div id="authError" class="text-xs text-rose-500 dark:text-rose-400 hidden bg-rose-500/10 p-2 rounded border border-rose-500/20"></div>
                <button onclick="handleAuthSubmit()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow transition">確定送出</button>
            </div>
        </div>
    </div>

    <!-- VIDEO MODAL -->
    <div id="videoModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#1e1e24] border border-zinc-200 dark:border-zinc-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-zinc-200 dark:border-zinc-800 pb-3">
                <h3 class="font-bold text-base text-zinc-900 dark:text-white">新增影音項目</h3>
                <button onclick="closeVideoModal()" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="grid grid-cols-1 gap-3">
                <div>
                    <label class="text-xs font-semibold text-zinc-600 dark:text-zinc-400">影音分類 *</label>
                    <input type="text" id="vFormCategory" placeholder="例如: 精選音樂, 知識科普, 旅遊紀錄" class="w-full text-xs p-2.5 bg-zinc-100 dark:bg-[#121215] border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white rounded-xl">
                </div>
                <div>
                    <label class="text-xs font-semibold text-zinc-600 dark:text-zinc-400">影片標題 *</label>
                    <input type="text" id="vFormTitle" placeholder="輸入影片標題" class="w-full text-xs p-2.5 bg-zinc-100 dark:bg-[#121215] border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white rounded-xl">
                </div>
                <div>
                    <label class="text-xs font-semibold text-zinc-600 dark:text-zinc-400">YouTube 影片網址 *</label>
                    <input type="text" id="vFormUrl" placeholder="https://www.youtube.com/watch?v=..." class="w-full text-xs p-2.5 bg-zinc-100 dark:bg-[#121215] border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white rounded-xl">
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeVideoModal()" class="px-4 py-2 bg-zinc-200 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 text-xs font-bold rounded-xl">取消</button>
                <button onclick="saveVideoItem()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow">儲存影片</button>
            </div>
        </div>
    </div>

    <!-- PHOTO MODAL -->
    <div id="photoModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#18181c] border border-zinc-200 dark:border-zinc-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-zinc-200 dark:border-zinc-800 pb-3">
                <h3 class="font-bold text-base text-zinc-900 dark:text-white">新增相簿照片</h3>
                <button onclick="closePhotoModal()" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="grid grid-cols-1 gap-3">
                <div>
                    <label class="text-xs font-semibold text-zinc-600 dark:text-zinc-400">相片分類 *</label>
                    <input type="text" id="pFormCategory" placeholder="例如: 自然風景, 旅遊紀錄, 家族合照" class="w-full text-xs p-2.5 bg-zinc-100 dark:bg-[#121215] border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white rounded-xl">
                </div>
                <div>
                    <label class="text-xs font-semibold text-zinc-600 dark:text-zinc-400">圖片網址 (URL) *</label>
                    <input type="text" id="pFormUrl" placeholder="https://images.unsplash.com/photo-..." class="w-full text-xs p-2.5 bg-zinc-100 dark:bg-[#121215] border border-zinc-300 dark:border-zinc-700 text-zinc-900 dark:text-white rounded-xl">
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closePhotoModal()" class="px-4 py-2 bg-zinc-200 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 text-xs font-bold rounded-xl">取消</button>
                <button onclick="savePhotoItem()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl shadow">儲存照片</button>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN LIGHTBOX MODAL -->
    <div id="lightboxModal" class="fixed inset-0 bg-black/90 backdrop-blur-lg z-50 hidden flex flex-col items-center justify-between p-4 sm:p-8">
        <div class="w-full flex justify-between items-center text-white z-10">
            <span class="text-xs font-mono text-zinc-400" id="lbCategory">分類</span>
            <button onclick="closeLightbox()" class="text-2xl text-zinc-400 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 w-full flex items-center justify-center overflow-hidden my-4">
            <img id="lbImage" src="" alt="Full view" class="max-w-full max-h-[75vh] object-contain rounded-lg shadow-2xl">
        </div>
        <div class="max-w-2xl w-full text-center space-y-2 bg-zinc-900/80 p-4 rounded-2xl border border-zinc-800 backdrop-blur">
            <p class="text-xs text-amber-400 font-semibold" id="lbNotes">備註說明...</p>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        let activeTab = 1;
        let currentUser = null;
        let authMode = 'login';
        let currentPhotoSize = 'medium';

        let selectedVideoIds = [];
        let selectedPhotoIds = [];

        // 預設影音資料庫（可自訂新增分類與拖曳）
        let videoList = localStorage.getItem('mediaBox_videoList_v5') !== null 
            ? JSON.parse(localStorage.getItem('mediaBox_videoList_v5')) 
            : [
                { id: 'v1', category: '精選音樂', title: '周杰倫 Jay Chou【晴天 Sunny Day】Official MV', url: 'https://www.youtube.com/watch?v=DYptgVvkVLQ' },
                { id: 'v2', category: '精選音樂', title: 'G.E.M. 鄧紫棋【光年之外 LIGHT YEARS AWAY】MV', url: 'https://www.youtube.com/watch?v=T4SimnaiktU' },
                { id: 'v3', category: '知識科普', title: '【老高與小茉】黑洞的盡頭是什麼？宇宙終極奧秘解析', url: 'https://www.youtube.com/watch?v=2f3uE2iI36U' },
                { id: 'v4', category: '旅遊紀錄', title: '【台灣 4K】絕美阿里山日出與雲海空拍導覽', url: 'https://www.youtube.com/watch?v=44444444401' }
            ];

        // 預設照片記錄資料庫
        let photoList = localStorage.getItem('mediaBox_photoList_v6') !== null 
            ? JSON.parse(localStorage.getItem('mediaBox_photoList_v6')) 
            : [];

        let currentPlayingVideoId = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedDarkMode = localStorage.getItem('mediaBox_darkMode');
            if (savedDarkMode === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('darkModeIcon').className = "fa-solid fa-sun";
            } else {
                document.documentElement.classList.add('dark');
                document.getElementById('darkModeIcon').className = "fa-solid fa-moon";
            }

            renderVideoSections();
            populateVideoDropdown();
            
            if (photoList.length === 0) {
                loadPhotosFromGithub(true);
            } else {
                renderPhotoGallery();
            }
            
            if (videoList.length > 0) {
                selectVideoFromDropdown(videoList[0].id);
            }
        });

        function toggleDarkMode() {
            const htmlEl = document.documentElement;
            const iconEl = document.getElementById('darkModeIcon');
            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                iconEl.className = "fa-solid fa-sun";
                localStorage.setItem('mediaBox_darkMode', 'light');
            } else {
                htmlEl.classList.add('dark');
                iconEl.className = "fa-solid fa-moon";
                localStorage.setItem('mediaBox_darkMode', 'dark');
            }
        }

        window.initAppListeners = function() {
            if (window.fbAuth && window.fbServices) {
                const { onAuthStateChanged, ref, onValue } = window.fbServices;
                onAuthStateChanged(window.fbAuth, (user) => {
                    if (user) {
                        currentUser = user;
                        updateUserUI();
                        loadUserDataFromFirebase();
                    } else {
                        currentUser = null;
                        updateUserUI();
                    }
                });

                const connectedRef = ref(window.fbDb, ".info/connected");
                onValue(connectedRef, (snap) => {
                    const connDot = document.getElementById('connDot');
                    const connStatus = document.getElementById('connStatus');
                    if (snap.val() === true) {
                        connDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                        connStatus.innerText = "🟢 已連線數據庫";
                    } else {
                        connDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                        connStatus.innerText = "🔴 離線模式";
                    }
                });
            }
        };

        function saveData() {
            localStorage.setItem('mediaBox_videoList_v5', JSON.stringify(videoList));
            localStorage.setItem('mediaBox_photoList_v6', JSON.stringify(photoList));
            saveToFirebase();
        }

        function saveToFirebase() {
            const now = new Date();
            const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('lastSaveTime').innerText = timeStr;

            if (currentUser && window.fbServices) {
                const { ref, set } = window.fbServices;
                set(ref(window.fbDb, 'users/' + currentUser.uid + '/data_v6'), { videoList, photoList, lastSaved: timeStr });
            }
        }

        function loadUserDataFromFirebase() {
            if (!currentUser || !window.fbServices) return;
            const { ref, get } = window.fbServices;
            get(ref(window.fbDb, 'users/' + currentUser.uid + '/data_v6')).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.videoList !== undefined) videoList = data.videoList;
                    if (data.photoList !== undefined) photoList = data.photoList;

                    renderVideoSections();
                    populateVideoDropdown();
                    renderPhotoGallery();
                }
            });
        }

        function updateUserUI() {
            const userInfoBox = document.getElementById('userInfoBox');
            const loginBtnTrigger = document.getElementById('loginBtnTrigger');
            const userNameDisplay = document.getElementById('userNameDisplay');
            const userAvatar = document.getElementById('userAvatar');

            if (currentUser) {
                userInfoBox.classList.remove('hidden');
                loginBtnTrigger.classList.add('hidden');
                const name = currentUser.displayName || currentUser.email.split('@')[0];
                userNameDisplay.innerText = name;
                userAvatar.innerText = name.charAt(0).toUpperCase();
            } else {
                userInfoBox.classList.add('hidden');
                loginBtnTrigger.classList.remove('hidden');
            }
        }

        function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
        function setAuthMode(mode) {
            authMode = mode;
            document.getElementById('authTabLogin').className = mode === 'login' ? "flex-1 py-1.5 text-xs font-bold rounded-lg transition bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow" : "flex-1 py-1.5 text-xs font-bold rounded-lg transition text-zinc-400";
            document.getElementById('authTabRegister').className = mode === 'register' ? "flex-1 py-1.5 text-xs font-bold rounded-lg transition bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow" : "flex-1 py-1.5 text-xs font-bold rounded-lg transition text-zinc-400";
            document.getElementById('realNameField').classList.toggle('hidden', mode === 'login');
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const realName = document.getElementById('authRealName').value.trim();
            const errorDiv = document.getElementById('authError');
            errorDiv.classList.add('hidden');

            if (!email || !password) {
                errorDiv.innerText = "請輸入 Email 及密碼";
                errorDiv.classList.remove('hidden');
                return;
            }

            const { createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } = window.fbServices;
            try {
                if (authMode === 'register') {
                    const res = await createUserWithEmailAndPassword(window.fbAuth, email, password);
                    await updateProfile(res.user, { displayName: realName || '會員' });
                    currentUser = res.user;
                } else {
                    const res = await signInWithEmailAndPassword(window.fbAuth, email, password);
                    currentUser = res.user;
                }
                closeAuthModal();
                updateUserUI();
                saveData();
            } catch (err) {
                errorDiv.innerText = "驗證失敗: " + err.message;
                errorDiv.classList.remove('hidden');
            }
        }

        function handleLogout() {
            if (window.fbServices) {
                window.fbServices.signOut(window.fbAuth).then(() => {
                    currentUser = null;
                    updateUserUI();
                });
            }
        }

        function switchTab(index) {
            if (index === 2) pauseVideoPlayer();
            activeTab = index;

            document.getElementById('tabBtn1').classList.toggle('active', index === 1);
            document.getElementById('tabBtn2').classList.toggle('active', index === 2);

            document.getElementById('tabContent1').classList.toggle('hidden', index !== 1);
            document.getElementById('tabContent2').classList.toggle('hidden', index !== 2);
        }

        function extractYTId(url) {
            if (!url) return '';
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            return match ? match[1] : url;
        }

        // ================= 影音撥放器 (TAB 1) 邏輯：依分類分區與拖曳 =================
        function renderVideoSections() {
            const container = document.getElementById('videoCategorySections');
            if(!container) return;
            container.innerHTML = '';

            const categories = [...new Set(videoList.map(v => v.category || '未分類'))];

            if (categories.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-xs text-zinc-500 bg-white dark:bg-[#18181c] rounded-2xl border border-zinc-200 dark:border-zinc-800">目前尚無影音項目，請點擊上方「新增影音」或「匯入 EXCEL」</div>`;
                return;
            }

            categories.forEach(cat => {
                const sec = document.createElement('div');
                sec.className = "bg-white dark:bg-[#18181c] border border-zinc-200 dark:border-zinc-800 rounded-2xl p-5 shadow-xl space-y-3 transition-colors";
                
                const catVideos = videoList.filter(v => (v.category || '未分類') === cat);

                sec.innerHTML = `
                    <div class="flex items-center justify-between border-b border-zinc-200 dark:border-zinc-800 pb-2.5">
                        <h4 class="font-bold text-sm text-zinc-900 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-folder-open text-blue-500"></i> ${cat}
                            <span class="text-xs font-normal text-zinc-400">(${catVideos.length} 部影片)</span>
                        </h4>
                        <span class="text-[11px] text-zinc-400"><i class="fa-solid fa-arrows-up-down-left-right mr-1"></i>可拖曳排序與移至此分類</span>
                    </div>
                    <div id="videoDropzone_${encodeURIComponent(cat)}" class="video-grid-dropzone grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 transition-all min-h-[80px] p-2 rounded-xl border-2 border-transparent" data-category="${cat}"></div>
                `;

                container.appendChild(sec);
                const grid = sec.querySelector('.video-grid-dropzone');

                // 拖曳事件處理
                grid.addEventListener('dragover', handleVideoDragOver);
                grid.addEventListener('dragleave', handleVideoDragLeave);
                grid.addEventListener('drop', (e) => handleVideoDrop(e, cat));

                catVideos.forEach(v => {
                    const isChecked = selectedVideoIds.includes(v.id);
                    const card = document.createElement('div');
                    card.draggable = true;
                    card.dataset.videoId = v.id;
                    card.className = `video-card bg-zinc-50 dark:bg-[#121215] border rounded-xl p-3 flex flex-col justify-between group relative transition shadow-sm cursor-grab active:cursor-grabbing hover:border-blue-500 ${isChecked ? 'border-blue-500 ring-2 ring-blue-500/40' : 'border-zinc-200 dark:border-zinc-800'}`;

                    card.addEventListener('dragstart', (e) => handleVideoDragStart(e, v.id));
                    card.addEventListener('dragend', handleVideoDragEnd);

                    card.innerHTML = `
                        <div class="space-y-2">
                            <div class="flex items-start justify-between gap-2">
                                <div class="flex items-center gap-2 flex-1">
                                    <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleVideoSelection('${v.id}')" class="w-4 h-4 accent-blue-500 cursor-pointer">
                                    <span class="font-bold text-xs text-zinc-800 dark:text-zinc-200 line-clamp-2">${v.title}</span>
                                </div>
                                <button onclick="deleteSingleVideo('${v.id}')" class="text-zinc-400 hover:text-rose-500 text-xs transition" title="刪除影片">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mt-3 flex items-center justify-between pt-2 border-t border-zinc-200/60 dark:border-zinc-800 text-[11px]">
                            <span class="text-zinc-400 truncate max-w-[150px]"><i class="fa-brands fa-youtube text-red-500 mr-1"></i>${v.url}</span>
                            <button onclick="selectVideoFromDropdown('${v.id}')" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold flex items-center gap-1 transition">
                                <i class="fa-solid fa-play text-[10px]"></i> 播放
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });

            updateVideoBatchBtnUI();
        }

        // --- 影音拖曳處理 ---
        let draggedVideoId = null;

        function handleVideoDragStart(e, id) {
            draggedVideoId = id;
            e.dataTransfer.setData('text/plain', id);
            e.target.classList.add('card-dragging');
        }

        function handleVideoDragEnd(e) {
            e.target.classList.remove('card-dragging');
            document.querySelectorAll('.video-grid-dropzone').forEach(el => el.classList.remove('drag-over'));
        }

        function handleVideoDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleVideoDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleVideoDrop(e, targetCat) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            
            if (!draggedVideoId) return;

            const video = videoList.find(v => v.id === draggedVideoId);
            if (video) {
                video.category = targetCat;
                saveData();
                renderVideoSections();
                populateVideoDropdown();
            }
        }

        function toggleVideoSelection(id) {
            if (selectedVideoIds.includes(id)) {
                selectedVideoIds = selectedVideoIds.filter(x => x !== id);
            } else {
                selectedVideoIds.push(id);
            }
            renderVideoSections();
        }

        function updateVideoBatchBtnUI() {
            const btn = document.getElementById('batchDeleteVideoBtn');
            const countSpan = document.getElementById('selectedVideoCount');

            if (selectedVideoIds.length > 0) {
                btn.classList.remove('hidden');
                countSpan.innerText = selectedVideoIds.length;
            } else {
                btn.classList.add('hidden');
            }
        }

        function batchDeleteVideo() {
            if (selectedVideoIds.length === 0) return;
            if (confirm(`確定批次刪除選取的 ${selectedVideoIds.length} 部影音嗎？`)) {
                if (selectedVideoIds.includes(currentPlayingVideoId)) {
                    pauseVideoPlayer();
                }
                videoList = videoList.filter(v => !selectedVideoIds.includes(v.id));
                selectedVideoIds = [];
                renderVideoSections();
                populateVideoDropdown();
                saveData();
            }
        }

        function deleteSingleVideo(id) {
            if (confirm("確定要刪除這部影音嗎？")) {
                if (currentPlayingVideoId === id) pauseVideoPlayer();
                videoList = videoList.filter(v => v.id !== id);
                selectedVideoIds = selectedVideoIds.filter(x => x !== id);
                renderVideoSections();
                populateVideoDropdown();
                saveData();
            }
        }

        function openVideoModal() { document.getElementById('videoModal').classList.remove('hidden'); }
        function closeVideoModal() { document.getElementById('videoModal').classList.add('hidden'); }

        function saveVideoItem() {
            const category = document.getElementById('vFormCategory').value.trim() || '預設分類';
            const title = document.getElementById('vFormTitle').value.trim();
            const url = document.getElementById('vFormUrl').value.trim();
            if (!title || !url) { alert("請填寫標題與網址"); return; }

            const newId = 'v_' + Date.now();
            videoList.push({ id: newId, category, title, url });

            closeVideoModal();
            renderVideoSections();
            populateVideoDropdown();
            saveData();
            
            if (!currentPlayingVideoId) {
                selectVideoFromDropdown(newId);
            }
        }

        function populateVideoDropdown() {
            const list = document.getElementById('videoPlaylistContainer');
            list.innerHTML = '';

            videoList.forEach((v, idx) => {
                const div = document.createElement('div');
                div.className = `p-2.5 rounded-xl border cursor-pointer flex items-center justify-between text-xs transition ${v.id === currentPlayingVideoId ? 'bg-blue-500/10 border-blue-500/30 text-blue-600 dark:text-white font-bold' : 'bg-zinc-50 dark:bg-[#121215] border-zinc-200 dark:border-zinc-800 text-zinc-700 dark:text-zinc-300'}`;
                div.onclick = () => selectVideoFromDropdown(v.id);
                div.innerHTML = `
                    <div class="truncate mr-2 flex-1">
                        <span class="text-[10px] text-blue-500 font-normal mr-1">[${v.category || '未分類'}]</span>
                        ${idx + 1}. ${v.title}
                    </div>
                `;
                list.appendChild(div);
            });
            document.getElementById('videoPlaylistCount').innerText = `${videoList.length} 部`;
        }

        function selectVideoFromDropdown(id) {
            const v = videoList.find(x => x.id === id);
            if (!v) return;

            currentPlayingVideoId = id;
            const ytId = extractYTId(v.url);
            document.getElementById('ytVideoIframe').src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
            document.getElementById('vpTitle').innerText = v.title;
            document.getElementById('vpCategoryTag').innerText = v.category || 'CINEMA';
            populateVideoDropdown();
        }

        function pauseVideoPlayer() {
            document.getElementById('ytVideoIframe').src = '';
            currentPlayingVideoId = null;
        }

        // --- 影音專屬匯入匯出功能 ---
        function exportVideoExcel() {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(videoList), "影音撥放器");
            XLSX.writeFile(wb, `MediaBox_Videos_${Date.now()}.xlsx`);
        }

        function importVideoExcel(evt) {
            const file = evt.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                if (workbook.SheetNames.length > 0) {
                    const imported = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    if (imported.length > 0) {
                        videoList = imported.map((item, index) => ({
                            id: item.id || ('v_' + Date.now() + '_' + index),
                            category: item.category || '未分類',
                            title: item.title || '無標題影片',
                            url: item.url || ''
                        }));
                        renderVideoSections();
                        populateVideoDropdown();
                        saveData();
                        alert("影音資料匯入成功！");
                    }
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportVideoPNG() {
            html2canvas(document.getElementById('videoExportArea'), { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `MediaBox_Videos.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function exportVideoPDF() {
            html2canvas(document.getElementById('videoExportArea'), { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                pdf.addImage(imgData, 'PNG', 0, 0, pdf.internal.pageSize.getWidth(), (canvas.height * pdf.internal.pageSize.getWidth()) / canvas.width);
                pdf.save(`MediaBox_Videos_Report.pdf`);
            });
        }

        // ================= 照片記錄 (TAB 2) 邏輯 =================

        // 從檔名轉換產生自動備註文字
        function generateNotesFromFileName(filename) {
            try {
                let name = decodeURIComponent(filename);
                name = name.replace(/\.(png|jpg|jpeg|gif|webp|svg|bmp)$/i, '');
                name = name.replace(/[-_]/g, ' ');
                return name.trim() || filename;
            } catch (e) {
                return filename.replace(/\.(png|jpg|jpeg|gif|webp|svg|bmp)$/i, '');
            }
        }

        // 從 GitHub 自動讀取圖片列表
        async function loadPhotosFromGithub(isInitial = false) {
            const apiUrl = 'https://api.github.com/repos/jacky1903002/mediabox/contents/image';
            const rawBaseUrl = 'https://raw.githubusercontent.com/jacky1903002/mediabox/main/image/';

            try {
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error('無法存取 GitHub API');

                const data = await res.json();
                if (Array.isArray(data)) {
                    const imageExtensions = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg', '.bmp'];
                    const imageFiles = data.filter(item => 
                        item.type === 'file' && imageExtensions.some(ext => item.name.toLowerCase().endsWith(ext))
                    );

                    const fetchedPhotos = imageFiles.map((file, idx) => {
                        const rawUrl = rawBaseUrl + encodeURIComponent(file.name);
                        const autoNotes = generateNotesFromFileName(file.name);
                        
                        // 保留既有已存在照片的類別與手動備註
                        const existing = photoList.find(p => p.url === rawUrl || p.fileName === file.name);

                        return {
                            id: existing ? existing.id : 'p_gh_' + idx + '_' + Date.now(),
                            category: existing ? existing.category : 'GitHub 相簿',
                            fileName: file.name,
                            url: rawUrl,
                            notes: existing ? existing.notes : autoNotes
                        };
                    });

                    if (fetchedPhotos.length > 0) {
                        photoList = fetchedPhotos;
                        saveData();
                        renderPhotoGallery();
                        if (!isInitial) alert(`已成功從 GitHub 同步 ${fetchedPhotos.length} 張照片！`);
                    } else {
                        if (!isInitial) alert("GitHub 資料夾中未找到圖片檔案。");
                    }
                }
            } catch (err) {
                console.error("載入 GitHub 照片失敗:", err);
                if (!isInitial) alert("抓取 GitHub 照片失敗，請檢查網路連線或儲存庫權限。");
            }
        }

        function setPhotoSize(size) {
            currentPhotoSize = size;
            document.getElementById('sizeBtnSmall').className = size === 'small' ? "px-2.5 py-1 rounded-lg transition bg-white dark:bg-zinc-800 text-amber-600 dark:text-amber-400 font-bold shadow" : "px-2.5 py-1 rounded-lg transition text-zinc-500 dark:text-zinc-400";
            document.getElementById('sizeBtnMedium').className = size === 'medium' ? "px-2.5 py-1 rounded-lg transition bg-white dark:bg-zinc-800 text-amber-600 dark:text-amber-400 font-bold shadow" : "px-2.5 py-1 rounded-lg transition text-zinc-500 dark:text-zinc-400";
            document.getElementById('sizeBtnLarge').className = size === 'large' ? "px-2.5 py-1 rounded-lg transition bg-white dark:bg-zinc-800 text-amber-600 dark:text-amber-400 font-bold shadow" : "px-2.5 py-1 rounded-lg transition text-zinc-500 dark:text-zinc-400";
            renderPhotoGallery();
        }

        function renderPhotoGallery() {
            const container = document.getElementById('photoCategorySections');
            if(!container) return;
            container.innerHTML = '';

            const categories = [...new Set(photoList.map(p => p.category || '未分類'))];

            if (categories.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-xs text-zinc-500 bg-white dark:bg-[#18181c] rounded-2xl border border-zinc-200 dark:border-zinc-800 space-y-3">
                        <p>目前尚無照片項目，請點擊上方「同步 GitHub 照片」或「新增照片」</p>
                        <button onclick="loadPhotosFromGithub()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition">
                            <i class="fa-solid fa-rotate-right mr-1"></i> 從 GitHub 讀取圖片
                        </button>
                    </div>`;
                return;
            }

            categories.forEach(cat => {
                const sec = document.createElement('div');
                sec.className = "bg-white dark:bg-[#18181c] border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6 shadow-xl space-y-4 transition-colors";
                
                const catPhotos = photoList.filter(p => (p.category||'未分類') === cat);

                sec.innerHTML = `
                    <div class="flex items-center justify-between border-b border-zinc-200 dark:border-zinc-800 pb-3">
                        <h3 class="font-bold text-base text-zinc-900 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-folder-open text-amber-500"></i> ${cat}
                            <span class="text-xs font-normal text-zinc-400">(${catPhotos.length} 張照片)</span>
                        </h3>
                        <span class="text-[11px] text-zinc-400"><i class="fa-solid fa-arrows-up-down-left-right mr-1"></i> 可拖曳排序/跨區</span>
                    </div>
                    <div id="photoDropzone_${encodeURIComponent(cat)}" class="photo-grid-dropzone grid gap-6 transition-all min-h-[120px] p-2 rounded-xl border-2 border-transparent" data-category="${cat}"></div>
                `;

                container.appendChild(sec);

                const grid = sec.querySelector('.photo-grid-dropzone');
                if (currentPhotoSize === 'small') {
                    grid.className = "photo-grid-dropzone grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 transition-all min-h-[120px] p-2 rounded-xl border-2 border-transparent";
                } else if (currentPhotoSize === 'large') {
                    grid.className = "photo-grid-dropzone grid grid-cols-1 gap-6 transition-all min-h-[120px] p-2 rounded-xl border-2 border-transparent";
                } else {
                    grid.className = "photo-grid-dropzone grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 transition-all min-h-[120px] p-2 rounded-xl border-2 border-transparent";
                }

                grid.addEventListener('dragover', handlePhotoDragOver);
                grid.addEventListener('dragleave', handlePhotoDragLeave);
                grid.addEventListener('drop', (e) => handlePhotoDrop(e, cat));

                catPhotos.forEach(p => {
                    const isChecked = selectedPhotoIds.includes(p.id);
                    const card = document.createElement('div');
                    card.draggable = true;
                    card.dataset.photoId = p.id;
                    card.className = `photo-card bg-zinc-50 dark:bg-[#121215] border rounded-2xl overflow-hidden flex flex-col group relative transition shadow-md cursor-grab active:cursor-grabbing ${isChecked ? 'border-amber-500 ring-2 ring-amber-500/50' : 'border-zinc-200 dark:border-zinc-800'}`;
                    
                    let imgHeight = "h-56";
                    if (currentPhotoSize === 'small') imgHeight = "h-36";
                    if (currentPhotoSize === 'large') imgHeight = "h-96";

                    card.addEventListener('dragstart', (e) => handlePhotoDragStart(e, p.id));
                    card.addEventListener('dragend', handlePhotoDragEnd);

                    const notesText = p.notes || "無備註說明 (雙擊此處編輯)";

                    card.innerHTML = `
                        <div class="w-full ${imgHeight} overflow-hidden relative cursor-pointer" onclick="openLightbox('${p.id}')">
                            <img src="${p.url}" alt="Photo" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.onerror=null;this.src='https://placehold.co/600x400/282830/ffffff?text=Image+Load+Error'">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation()" onchange="togglePhotoSelection('${p.id}')" class="absolute top-3 left-3 w-5 h-5 accent-amber-500 cursor-pointer shadow-lg z-10">
                            <button onclick="event.stopPropagation(); deleteSinglePhoto('${p.id}')" class="absolute top-2 right-2 w-8 h-8 bg-rose-600/80 hover:bg-rose-600 text-white rounded-full flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition shadow z-10" title="刪除照片">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        <div class="p-3 bg-white dark:bg-[#18181c] border-t border-zinc-200 dark:border-zinc-800 space-y-1">
                            <div class="flex items-center justify-between text-[10px] text-amber-500 font-bold">
                                <span>${p.category || '未分類'}</span>
                                <span class="text-zinc-400 font-normal"><i class="fa-solid fa-i-cursor mr-1"></i>雙擊備註修改</span>
                            </div>
                            <div id="notesDisplay_${p.id}" class="text-xs text-zinc-600 dark:text-zinc-400 truncate cursor-pointer hover:text-amber-500 transition" title="點擊兩次以編輯備註" ondblclick="enableNotesEdit('${p.id}')">
                                <i class="fa-regular fa-note-sticky mr-1 text-zinc-400"></i>${notesText}
                            </div>
                            <div id="notesEditBox_${p.id}" class="hidden flex items-center space-x-1 pt-1">
                                <input type="text" id="notesInput_${p.id}" value="${p.notes || ''}" placeholder="輸入備註..." class="flex-1 text-xs p-1 bg-zinc-100 dark:bg-[#121215] border border-amber-500 rounded text-zinc-900 dark:text-white focus:outline-none" onkeydown="if(event.key==='Enter') saveNotesEdit('${p.id}')">
                                <button onclick="saveNotesEdit('${p.id}')" class="px-2 py-1 bg-amber-500 text-white text-[10px] font-bold rounded">儲存</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });

            updatePhotoBatchBtnUI();
        }

        function enableNotesEdit(photoId) {
            document.getElementById(`notesDisplay_${photoId}`).classList.add('hidden');
            const editBox = document.getElementById(`notesEditBox_${photoId}`);
            editBox.classList.remove('hidden');
            const input = document.getElementById(`notesInput_${photoId}`);
            input.focus();
            input.select();
        }

        function saveNotesEdit(photoId) {
            const input = document.getElementById(`notesInput_${photoId}`);
            const newNotes = input.value.trim();
            
            const photo = photoList.find(p => p.id === photoId);
            if (photo) {
                photo.notes = newNotes;
                saveData();
            }
            renderPhotoGallery();
        }

        // --- 照片拖曳處理 ---
        let draggedPhotoId = null;

        function handlePhotoDragStart(e, id) {
            draggedPhotoId = id;
            e.dataTransfer.setData('text/plain', id);
            e.target.classList.add('card-dragging');
        }

        function handlePhotoDragEnd(e) {
            e.target.classList.remove('card-dragging');
            document.querySelectorAll('.photo-grid-dropzone').forEach(el => el.classList.remove('photo-drag-over'));
        }

        function handlePhotoDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('photo-drag-over');
        }

        function handlePhotoDragLeave(e) {
            e.currentTarget.classList.remove('photo-drag-over');
        }

        function handlePhotoDrop(e, targetCat) {
            e.preventDefault();
            e.currentTarget.classList.remove('photo-drag-over');
            
            if (!draggedPhotoId) return;

            const photo = photoList.find(p => p.id === draggedPhotoId);
            if (photo) {
                photo.category = targetCat;
                saveData();
                renderPhotoGallery();
            }
        }

        function openLightbox(photoId) {
            const photo = photoList.find(p => p.id === photoId);
            if (!photo) return;

            document.getElementById('lbImage').src = photo.url;
            document.getElementById('lbCategory').innerText = `分類: ${photo.category || '未分類'}`;
            document.getElementById('lbNotes').innerText = photo.notes ? `備註: ${photo.notes}` : '無備註說明';
            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        function togglePhotoSelection(id) {
            if (selectedPhotoIds.includes(id)) {
                selectedPhotoIds = selectedPhotoIds.filter(x => x !== id);
            } else {
                selectedPhotoIds.push(id);
            }
            renderPhotoGallery();
        }

        function updatePhotoBatchBtnUI() {
            const btn = document.getElementById('batchDeletePhotoBtn');
            const countSpan = document.getElementById('selectedPhotoCount');

            if (selectedPhotoIds.length > 0) {
                btn.classList.remove('hidden');
                countSpan.innerText = selectedPhotoIds.length;
            } else {
                btn.classList.add('hidden');
            }
        }

        function batchDeletePhoto() {
            if (selectedPhotoIds.length === 0) return;
            if (confirm(`確定要批次刪除選取的 ${selectedPhotoIds.length} 張照片嗎？`)) {
                photoList = photoList.filter(p => !selectedPhotoIds.includes(p.id));
                selectedPhotoIds = [];
                renderPhotoGallery();
                saveData();
            }
        }

        function deleteSinglePhoto(id) {
            if (confirm("確定刪除這張照片嗎？")) {
                photoList = photoList.filter(p => p.id !== id);
                selectedPhotoIds = selectedPhotoIds.filter(x => x !== id);
                renderPhotoGallery();
                saveData();
            }
        }

        function openPhotoModal() { document.getElementById('photoModal').classList.remove('hidden'); }
        function closePhotoModal() { document.getElementById('photoModal').classList.add('hidden'); }

        function savePhotoItem() {
            const category = document.getElementById('pFormCategory').value.trim() || '預設相簿';
            const url = document.getElementById('pFormUrl').value.trim();
            if (!url) { alert("請填寫圖片網址"); return; }

            photoList.push({
                id: 'p_' + Date.now(),
                category,
                url,
                notes: '雙擊此處編輯備註內容'
            });

            closePhotoModal();
            renderPhotoGallery();
            saveData();
        }

        // --- 照片記錄專屬匯入匯出功能 ---
        function exportPhotoExcel() {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(photoList), "照片記錄");
            XLSX.writeFile(wb, `MediaBox_Photos_${Date.now()}.xlsx`);
        }

        function importPhotoExcel(evt) {
            const file = evt.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                if (workbook.SheetNames.length > 0) {
                    const imported = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    if (imported.length > 0) {
                        photoList = imported.map((item, index) => ({
                            id: item.id || ('p_' + Date.now() + '_' + index),
                            category: item.category || '未分類',
                            url: item.url || '',
                            notes: item.notes || '雙擊此處編輯備註內容'
                        }));
                        renderPhotoGallery();
                        saveData();
                        alert("照片紀錄匯入成功！");
                    }
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportPhotoPNG() {
            html2canvas(document.getElementById('photoExportArea'), { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `MediaBox_Photos.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function exportPhotoPDF() {
            html2canvas(document.getElementById('photoExportArea'), { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                pdf.addImage(imgData, 'PNG', 0, 0, pdf.internal.pageSize.getWidth(), (canvas.height * pdf.internal.pageSize.getWidth()) / canvas.width);
                pdf.save(`MediaBox_Photos_Report.pdf`);
            });
        }
    </script>
</body>
</html>
